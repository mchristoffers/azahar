# forker build: builds the fork on GitHub Actions and publishes a release on it.
# The build job(s) are written per project by the create-build skill (fix with repair-build).
#
# Contract:
#   - build jobs mirror the project's own CI release job (one comment line naming it)
#   - each build job uploads only release artifacts (flat files) via actions/upload-artifact,
#     with an artifact name starting with "dist-"; they become the release assets
#   - every build job is listed in publish.needs; build jobs keep the read-only default permissions
#   - never edit upstream files; forker lives in forker/ and .github/workflows/forker-*.yml
#   - everything below "generic" stays as is
name: forker-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create on the fork (empty = build only)
        default: ""

# Build jobs run upstream code, so they only read; publish and report get write access per job.
permissions:
  contents: read

jobs:
  # From the android job in .github/workflows/build.yml (.ci/android.sh, .ci/pack.sh), vanilla flavor only.
  build:
    runs-on: ubuntu-latest
    env:
      OS: android
      TARGET: vanilla
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-vanilla-${{ github.sha }}
          restore-keys: ${{ runner.os }}-android-vanilla-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - name: Pack
        working-directory: src/android/app
        env:
          VERSION: ${{ inputs.version }}
        run: UNPACKED=1 GITHUB_REF_TYPE=tag GITHUB_REF_NAME="${VERSION:-$(git rev-parse --short HEAD)}" ../../../.ci/pack.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist-android-vanilla
          path: src/android/app/artifacts/
          if-no-files-found: error

  # ---- generic ----
  publish:
    needs: [build]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Rerunning this job re-uploads into the existing release instead of failing.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$VERSION" --notes "Built by forker from $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  report:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          title="forker: build failed${VERSION:+ for $VERSION}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --json title --jq '.[].title' | grep -Fxq "$title"; then
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit $GITHUB_SHA). Fix it with the repair-build skill."
